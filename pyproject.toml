[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "turkmopet-b2b-growth-suite"
version = "0.6.0"
description = "Deterministic B2B account scoring primitives for wholesale growth workflows."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enes Akin" }]

[project.scripts]
b2b-score = "turkmopet_b2b.cli:main"
b2b-trend = "turkmopet_b2b.history_cli:main"
b2b-task = "turkmopet_b2b.task_cli:main"
b2b-sla = "turkmopet_b2b.sla_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
